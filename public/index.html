<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo4j Dataflow Visualizer API</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 25%),
          radial-gradient(circle at 80% 0%, rgba(59, 130, 246, 0.12), transparent 25%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      header {
        padding: 32px 24px 8px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: -0.5px;
      }

      p.lead {
        margin: 0;
        color: var(--muted);
      }

      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 24px 32px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .card {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      form {
        display: grid;
        gap: 10px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
      }

      input,
      select,
      button,
      textarea {
        font: inherit;
      }

      input,
      select,
      textarea {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
      }

      button {
        padding: 12px 14px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        color: #0b1220;
        font-weight: 700;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 25px rgba(56, 189, 248, 0.45);
      }

      .muted {
        color: var(--muted);
        font-size: 14px;
      }

      pre {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 14px;
        color: var(--text);
        overflow: auto;
      }

      .output {
        min-height: 120px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.16);
        color: #38bdf8;
        font-weight: 600;
        font-size: 13px;
      }

      footer {
        text-align: center;
        padding: 12px 0 24px;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        header {
          padding: 24px 16px 4px;
        }

        main {
          padding: 0 16px 24px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="badge">Vercel Ready UI</div>
      <h1>Neo4j Dataflow Visualizer API</h1>
      <p class="lead">デプロイ先のルートにアクセスすると、APIの状態確認と簡易リクエストができるUIです。</p>
    </header>

    <main>
      <div class="grid">
        <section class="card">
          <h2>ヘルスチェック</h2>
          <p class="muted">/api/health にアクセスして現在のステータスを確認します。</p>
          <button id="healthBtn" type="button">ステータスを取得</button>
          <pre id="healthOutput" class="output">クリックしてレスポンスを確認</pre>
        </section>

        <section class="card">
          <h2>スナップショット一覧</h2>
          <p class="muted">利用可能なスナップショットをロードしてフォームに反映します。</p>
          <button id="snapshotBtn" type="button">スナップショットを取得</button>
          <pre id="snapshotOutput" class="output">まだ読み込んでいません</pre>
        </section>
      </div>

      <div class="grid">
        <section class="card">
          <h2>グラフ取得</h2>
          <form id="graphForm">
            <label>
              rootId
              <input id="rootId" name="rootId" placeholder="例: ingest-oppty" value="ingest-oppty" required />
            </label>
            <label>
              depth
              <input id="depth" name="depth" type="number" min="1" max="5" value="2" />
            </label>
            <label>
              direction
              <select id="direction" name="direction">
                <option value="both">both</option>
                <option value="down">down</option>
                <option value="up">up</option>
              </select>
            </label>
            <label>
              snapshot
              <select id="snapshot" name="snapshot"></select>
            </label>
            <button type="submit">/api/graph を呼び出す</button>
          </form>
          <pre id="graphOutput" class="output">レスポンスがここに表示されます</pre>
        </section>

        <section class="card">
          <h2>差分比較</h2>
          <form id="diffForm">
            <label>
              base
              <select id="baseSnapshot" name="base"></select>
            </label>
            <label>
              target
              <select id="targetSnapshot" name="target"></select>
            </label>
            <button type="submit">/api/diff を呼び出す</button>
          </form>
          <pre id="diffOutput" class="output">レスポンスがここに表示されます</pre>
        </section>
      </div>
    </main>

    <footer>© 2024 Neo4j Dataflow Visualizer</footer>

    <script>
      const healthBtn = document.getElementById('healthBtn');
      const snapshotBtn = document.getElementById('snapshotBtn');
      const snapshotOutput = document.getElementById('snapshotOutput');
      const healthOutput = document.getElementById('healthOutput');
      const graphForm = document.getElementById('graphForm');
      const diffForm = document.getElementById('diffForm');
      const graphOutput = document.getElementById('graphOutput');
      const diffOutput = document.getElementById('diffOutput');
      const snapshotSelect = document.getElementById('snapshot');
      const baseSelect = document.getElementById('baseSnapshot');
      const targetSelect = document.getElementById('targetSnapshot');

      function formatJson(data) {
        return JSON.stringify(data, null, 2);
      }

      async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status}: ${text}`);
        }
        return res.json();
      }

      async function loadSnapshots() {
        try {
          const data = await fetchJson('/api/snapshots');
          const snapshots = data.snapshots || [];
          snapshotOutput.textContent = formatJson(snapshots);
          [snapshotSelect, baseSelect, targetSelect].forEach((select) => {
            select.innerHTML = '';
            snapshots.forEach((snap, index) => {
              const option = document.createElement('option');
              option.value = snap;
              option.textContent = snap;
              if (index === 0 && select.options.length === 0) {
                option.selected = true;
              }
              select.appendChild(option);
            });
          });
        } catch (error) {
          snapshotOutput.textContent = `エラー: ${error.message}`;
        }
      }

      healthBtn.addEventListener('click', async () => {
        try {
          const data = await fetchJson('/api/health');
          healthOutput.textContent = formatJson(data);
        } catch (error) {
          healthOutput.textContent = `エラー: ${error.message}`;
        }
      });

      snapshotBtn.addEventListener('click', loadSnapshots);

      graphForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const params = new URLSearchParams(new FormData(graphForm));
        graphOutput.textContent = 'Loading...';
        try {
          const data = await fetchJson(`/api/graph?${params.toString()}`);
          graphOutput.textContent = formatJson(data);
        } catch (error) {
          graphOutput.textContent = `エラー: ${error.message}`;
        }
      });

      diffForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const params = new URLSearchParams(new FormData(diffForm));
        diffOutput.textContent = 'Loading...';
        try {
          const data = await fetchJson(`/api/diff?${params.toString()}`);
          diffOutput.textContent = formatJson(data);
        } catch (error) {
          diffOutput.textContent = `エラー: ${error.message}`;
        }
      });

      // 初期ロード
      loadSnapshots();
      healthBtn.click();
    </script>
  </body>
</html>
