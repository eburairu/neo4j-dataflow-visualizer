<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo4j AuraDB Viewer</title>
  <!-- Load NeoVis from CDN -->
  <script src="https://unpkg.com/neovis.js@2.0.2/dist/neovis.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1>Neo4j AuraDB Viewer</h1>
        <p>GitHub Pages + Browser Only (neovis.js)</p>
      </div>
      <div class="search-bar" role="search">
        <input id="graph-search" type="search" placeholder="ノード・リレーションを検索" aria-label="グラフ検索" />
        <button id="search-clear" class="secondary-button" type="button">Clear</button>
      </div>
    </div>
    <div class="search-feedback" aria-live="polite" id="search-feedback">検索未実行</div>
  </header>
  <main>
    <section id="control-panel" aria-label="Connection and Query Panel">
      <div class="panel-content">
        <details id="credentials" open>
          <summary>認証情報（実行後は折りたたみ可能）</summary>
          <div>
            <label for="uri">AuraDB URI</label>
            <input id="uri" type="text" placeholder="neo4j+s://xxxx.databases.neo4j.io" />
          </div>
          <div>
            <label for="user">Username</label>
            <input id="user" type="text" />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" />
          </div>
        </details>
        <div>
          <label for="cypher">Cypher Query</label>
          <textarea id="cypher">MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 100;</textarea>
        </div>
        <button id="runBtn" type="button">Run &amp; Visualize</button>
        <div id="status-container">
          <label for="status">Status / Log</label>
          <div id="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <section id="viz-container" aria-label="Visualization Area">
      <div id="viz"></div>
      <aside id="node-details-panel" aria-live="polite" hidden>
        <div class="panel-header">
          <h2>Selected Node</h2>
          <button id="close-node-details" class="secondary-button" type="button">Clear</button>
        </div>
        <dl>
          <div class="detail-row">
            <dt>ID</dt>
            <dd id="node-id">-</dd>
          </div>
          <div class="detail-row">
            <dt>Label</dt>
            <dd id="node-label">-</dd>
          </div>
          <div class="detail-row">
            <dt>Properties</dt>
            <dd id="node-properties">-</dd>
          </div>
        </dl>
      </aside>
      <div id="relationship-popover" hidden>
        <header>
          <h3>Relationship</h3>
          <button id="close-relationship-popover" class="close-btn" type="button">Close</button>
        </header>
        <dl>
          <div class="detail-row">
            <dt>Type</dt>
            <dd id="relationship-type">-</dd>
          </div>
          <div class="detail-row">
            <dt>Direction</dt>
            <dd id="relationship-direction">-</dd>
          </div>
          <div class="detail-row">
            <dt>From</dt>
            <dd id="relationship-from">-</dd>
          </div>
          <div class="detail-row">
            <dt>To</dt>
            <dd id="relationship-to">-</dd>
          </div>
          <div class="detail-row">
            <dt>Attributes</dt>
            <dd id="relationship-properties">-</dd>
          </div>
        </dl>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
